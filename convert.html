<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSV変換 (iPad/iPhone対応版)</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; max-width: 600px; margin: 20px auto; padding: 15px; background-color: #f0f2f5; color: #333; }
        .card { background: white; padding: 25px; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); }
        h2 { margin-top: 0; font-size: 1.2rem; text-align: center; }
        
        /* タップしやすい大きめのエリア */
        .upload-area {
            border: 3px dashed #A0AEC0;
            padding: 60px 20px;
            text-align: center;
            margin-bottom: 20px;
            cursor: pointer;
            border-radius: 12px;
            background: #F7FAFC;
            transition: 0.2s;
            -webkit-tap-highlight-color: transparent;
        }
        .upload-area:active { background-color: #EDF2F7; transform: scale(0.98); }
        .upload-area.dragover { border-color: #4299E1; background-color: #EBF8FF; }

        #preview { width: 100%; height: 150px; margin-top: 15px; font-family: ui-monospace, SFMono-Regular, monospace; padding: 12px; border: 1px solid #E2E8F0; border-radius: 8px; box-sizing: border-box; background: #F8FAFC; font-size: 14px; }
        
        button { background: #007AFF; color: white; border: none; padding: 16px 20px; border-radius: 12px; cursor: pointer; width: 100%; font-size: 17px; font-weight: 600; margin-top: 15px; }
        button:active { background: #0056b3; }
        
        .status { font-size: 0.85em; color: #4A5568; margin-bottom: 10px; text-align: center; min-height: 1.2em; }
    </style>
</head>
<body>

<div class="card">
    <h2>CSV 変換・保存</h2>
    
    <div id="status" class="status"></div>

    <!-- iPadでも反応するように input の accept をあえて外すか汎用的に設定 -->
    <div id="dropZone" class="upload-area">
        <input type="file" id="fileInput" style="display:none">
        <strong>ここをタップして選択</strong><br>
        <span style="font-size: 0.8em; color: #718096;">（またはファイルをドロップ）</span>
    </div>
    
    <div id="resultArea" style="display:none">
        <div style="font-size: 0.85em; font-weight: bold;">変換後のデータ:</div>
        <textarea id="preview" readonly></textarea>
        <button id="downloadBtn">.txtファイルを保存する</button>
    </div>
</div>

<script>
    const dropZone = document.getElementById('dropZone');
    const fileInput = document.getElementById('fileInput');
    const status = document.getElementById('status');
    const resultArea = document.getElementById('resultArea');
    const preview = document.getElementById('preview');
    const downloadBtn = document.getElementById('downloadBtn');

    let convertedContent = "";

    // イベント停止用
    const preventDefaults = (e) => { e.preventDefault(); e.stopPropagation(); };
    ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(n => window.addEventListener(n, preventDefaults));

    dropZone.addEventListener('dragover', () => dropZone.classList.add('dragover'));
    dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
    dropZone.addEventListener('click', () => fileInput.click());

    fileInput.addEventListener('change', (e) => handleFiles(e.target.files));
    dropZone.addEventListener('drop', (e) => {
        dropZone.classList.remove('dragover');
        handleFiles(e.dataTransfer.files);
    });

    function handleFiles(files) {
        if (files.length === 0) return;
        const file = files[0];
        status.textContent = "読み込み中: " + file.name;

        const reader = new FileReader();
        
        // iPadやWindowsでの文字化け対策（UTF-8で読み込み）
        reader.onload = function(e) {
            const text = e.target.result;
            // カンマ、改行、タブなどで分割し、空要素を除去して再結合
            const items = text.split(/[\r\n\t,]+/)
                              .map(item => item.trim())
                              .filter(item => item !== "");

            convertedContent = items.join(',');
            preview.value = convertedContent;
            resultArea.style.display = 'block';
            status.textContent = "✅ 変換完了";
        };

        reader.readAsText(file, "UTF-8"); 
    }

    downloadBtn.addEventListener('click', () => {
        const blob = new Blob([convertedContent], { type: 'text/plain' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = "output.txt";
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
    });
</script>

</body>
</html>
